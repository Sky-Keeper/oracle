<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>infinity</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style>

<div class="fb-lz">

  .love-infinity {

  }

    font-family: "Times New Roman", serif;
    font-size: 23px;
    font-style: italic;
    letter-spacing: .2px;
    fill: #111;
  }
  .love-infinity .hl { fill: #8B0000; font-weight: bold; }
  @keyframes infinity-sway {
    from { transform: translateX(-5px); }
    to   { transform: translateX(5px); }
  }
  @keyframes infinity-glow {
    0%, 100% { opacity: .78; }
    50%      { opacity: 1; }
  }
