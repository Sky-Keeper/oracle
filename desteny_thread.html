<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>нить</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,500&family=Marcellus&family=EB+Garamond:ital,wght@0,500;1,400;1,500&display=swap');
html,body{margin:0;padding:0;background:transparent;font-family:Georgia,serif}

@keyframes thSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes thPull{0%,100%{transform:translateY(0)}45%{transform:translateY(7px)}}
@keyframes thDraw{to{stroke-dashoffset:0}}
@keyframes thIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes thSway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes thFloat{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.9}80%{opacity:.6}100%{transform:translateY(-90px) translateX(var(--dx,6px));opacity:0}}
@keyframes thBallGlow{0%,100%{box-shadow:inset -4px -4px 9px rgba(0,0,0,.45),0 0 14px rgba(255,150,105,.45),0 3px 9px rgba(40,8,4,.5)}50%{box-shadow:inset -4px -4px 9px rgba(0,0,0,.45),0 0 26px rgba(255,175,130,.85),0 3px 9px rgba(40,8,4,.5)}}
@keyframes thHue{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes thGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(196,85,60,.45))}50%{filter:drop-shadow(0 0 10px rgba(224,110,72,.8))}}
@keyframes thShake{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(-2px) rotate(-7deg)}70%{transform:translateX(2px) rotate(7deg)}}
@keyframes thFlash{0%{transform:scale(1);box-shadow:0 0 9px rgba(255,190,150,.75)}45%{transform:scale(1.9);box-shadow:0 0 22px rgba(255,225,190,1)}100%{transform:scale(1);box-shadow:0 0 9px rgba(255,190,150,.75)}}
@keyframes thSpark{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--sx,10px),-18px) scale(1)}}

.th{display:inline-block;width:100%;max-width:492px;padding:6px 16px 7px;text-align:center;
  background:linear-gradient(120deg,#8A2418,#B5502C 35%,#C4553C 65%,#8A2418);background-size:300% 100%;animation:thHue 12s ease-in-out infinite;
  border:1px solid rgba(255,206,178,.4);border-radius:14px;box-shadow:none;position:relative;overflow:hidden}
/* тканое переплетение */
.th:before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:repeating-linear-gradient(0deg,rgba(255,220,190,.07) 0 1px,transparent 1px 4px),
                   repeating-linear-gradient(90deg,rgba(90,20,12,.09) 0 1px,transparent 1px 4px)}
/* паутина тонких нитей */
.th-web{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.4}
.th-web path{fill:none;stroke:rgba(255,214,186,.32);stroke-width:.6;
  animation:thSway 9s ease-in-out infinite}
.th-web path:nth-child(2){animation-duration:11s;animation-delay:-3s}
.th-web path:nth-child(3){animation-duration:13s;animation-delay:-6s}
/* пылинки */
.th-dust{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.th-dust i{position:absolute;bottom:-4px;width:2.5px;height:2.5px;border-radius:50%;
  background:radial-gradient(circle,#FFE6CC,transparent 70%);box-shadow:0 0 5px rgba(255,215,180,.8);
  animation:thFloat linear infinite}
.th *{box-sizing:border-box}
.th-cap{position:relative;z-index:2;display:block;font-family:'Marcellus',Georgia,serif;font-size:11px;
  letter-spacing:4px;text-transform:uppercase;color:#FFE0CA;margin-bottom:2px;opacity:.95;
  text-shadow:0 1px 8px rgba(90,25,12,.55)}
.th-stage{position:relative;z-index:2;height:26px;cursor:pointer;animation:thGlow 4s ease-in-out infinite}
.th-stage svg{position:absolute;inset:0;width:100%;height:100%}
.th-path{fill:none;stroke:url(#thg);stroke-width:1.9;stroke-linecap:round;
  stroke-dasharray:450;stroke-dashoffset:450;opacity:.9}
.th-stage.go .th-path{animation:thDraw 1s ease-out forwards}
.th-stage.go .th-ball{animation:thShake .45s ease-in-out}
.th-stage.go .th-knot{animation:thFlash .7s ease-out .55s}
.th-spark{position:absolute;width:3px;height:3px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#FFE8CC,transparent 70%);box-shadow:0 0 6px rgba(255,205,165,.9);opacity:0}
.th-stage.go .th-spark{animation:thSpark 1.1s ease-out forwards}
.th-ball{position:absolute;left:2px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;
  background:radial-gradient(circle at 33% 28%,#FFB48C,#C4553C 52%,#7A1F14 100%);
  box-shadow:inset -4px -4px 9px rgba(0,0,0,.45),0 0 16px rgba(255,150,105,.55),0 3px 9px rgba(40,8,4,.5);
  animation:thBallGlow 3.4s ease-in-out infinite}
.th-ball i{position:absolute;inset:3px;border-radius:50%;opacity:.55;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,170,.35) 0 6deg,transparent 6deg 16deg);
  animation:thSpin 14s linear infinite}
.th-knot{position:absolute;right:3px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#FFF0DC,#F2A882 55%,#B5502C);
  box-shadow:0 0 14px rgba(255,205,170,.9),inset -2px -2px 5px rgba(120,40,20,.4);
  animation:thPull 2.6s ease-in-out infinite}
.th-txt{position:relative;z-index:2;display:block;font-family:'EB Garamond','Cormorant Garamond',Georgia,serif;font-size:14px;font-style:italic;font-weight:500;
  color:#FFF4E8;line-height:1.3;margin-top:3px;padding:0 4px;min-height:36px;
  text-shadow:0 1px 6px rgba(90,25,12,.5)}
.th-txt.new{animation:thIn .55s ease-out}
</style></head>
<body><center>
<div class="th">
  <svg class="th-web" viewBox="0 0 500 100" preserveAspectRatio="none">
    <path d="M-10,15 C110,28 240,4 360,22 C420,32 470,16 510,25"/>
    <path d="M-10,52 C100,38 230,68 350,50 C410,40 470,58 510,48"/>
    <path d="M-10,84 C120,72 250,94 370,78 C430,70 470,86 510,78"/>
  </svg>
  <span class="th-dust">
    <i style="left:9%;--dx:5px;animation-duration:7s;animation-delay:0s"></i>
    <i style="left:23%;--dx:-6px;animation-duration:9s;animation-delay:1.6s"></i>
    <i style="left:41%;--dx:7px;animation-duration:8s;animation-delay:3.1s"></i>
    <i style="left:58%;--dx:-4px;animation-duration:10s;animation-delay:.7s"></i>
    <i style="left:73%;--dx:6px;animation-duration:7.5s;animation-delay:4.2s"></i>
    <i style="left:88%;--dx:-7px;animation-duration:9.5s;animation-delay:2.4s"></i>
  </span>
  <span class="th-cap">Choose Your Destiny</span>
  <div class="th-stage" id="ths" onclick="pullThread()">
    <svg viewBox="0 0 460 26" preserveAspectRatio="none">
      <defs><linearGradient id="thg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFD9BC"/><stop offset=".5" stop-color="#FFF0E0"/><stop offset="1" stop-color="#F2A882"/>
      </linearGradient></defs>
      <path class="th-path" d="M26,13 C96,2 156,24 230,13 C304,2 364,24 434,13"/>
    </svg>
    <span class="th-ball"><i></i></span>
    <span class="th-knot"></span>
    <span class="th-spark" style="left:26%;top:40%;--sx:-7px;animation-delay:.25s"></span>
    <span class="th-spark" style="left:50%;top:26%;--sx:9px;animation-delay:.45s"></span>
    <span class="th-spark" style="left:74%;top:42%;--sx:-5px;animation-delay:.65s"></span>
  </div>
  <span class="th-txt" id="tht"></span>
</div>
</center>

<script>
var TH=["Молчащий дольше всех скажет главное.","Закрытая в спешке дверь откроется сама.","Тебе солгут красиво — и ты поверишь.","Ночная мысль ещё пригодится.","Получишь просимое. Проверь, о чём просил.","Помеха окажется единственным выходом.","Не спеши прощать. Но и не тяни.","Неотправленное письмо дойдёт иначе.","Слабость спасёт вернее силы.","На тебя смотрят дольше приличного.","Это не конец, а пауза без дыхания.","Одно случайное «да» изменит три месяца.","Ты уже знаешь ответ. Нить лишь подтверждает.","Твоё имя произнесут в твоё отсутствие.","Не бери всё. Половину придётся оставить у порога.","Ушедший первым вернётся последним.","Считай до трёх — передумаешь.","Тебе предложат выбор из двух зол. Есть третье.","Старый долг напомнит забытым голосом.","Тишина скажет больше слов.","Твоё фото хранят дольше, чем ты думаешь.","Стыдная ошибка окажется лучшим шагом.","Дождь без зонта — лучшая часть дня.","Не ищи знак — ты прошёл мимо него дважды.","Потерянный ключ — от исчезнувшей двери.","Между правотой и человеком выбери человека.","Отложенное начнёт откладывать тебя.","Один разговор перевесит все прошлогодние.","Вернут списанное в потери.","Твоё «нет» будет стоить дороже любого «да».","Холодные глаза окажутся теплее прочих.","Будет неудобно. Потом окажется — твоё.","План сорвётся — и станет лучше.","Молчание в этот раз — твой самый сильный ход.","Тебя недооценят. Позволь — так проще выиграть.","Оплаканное найдётся живым.","Гость придёт не вовремя и окажется вовремя.","Худшее уже случилось. Дальше только распутывать.","Кто смеётся громче — устал больше.","Твоё ходит медленно и приходит само.","Что-то сломается вовремя. Не чини сразу.","Ты ждал не того человека, а того себя.","Усталость — счёт, оплати его сном.","Просящий меньше нуждается больше.","Сказанное сгоряча окажется честным.","Попросят не вовремя — согласись.","Выберешь покой вместо победы.","Кажется, опоздал? Ты первый.","Спорящий с тобой — на твоей стороне.","Станет тихо. Это место для нового.","Не выбрасывай черновик.","Скажут «справлюсь» — не поверь, приди.","Решение принято. Осталось согласиться с собой.","Тебе простят раньше, чем попросишь.","Дверь хлопнет. Не оборачивайся.","«Мне всё равно» значит: напиши.","Придётся выбрать между удобным и настоящим.","Терпение почти сработало. Ещё немного.","Ты скажешь «совпадение». Нить — нет."];
var thLast=-1;
function pullThread(){
  var s=document.getElementById('ths'),t=document.getElementById('tht');
  s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
  t.classList.remove('new');
  setTimeout(function(){
    var i;do{i=Math.floor(Math.random()*TH.length)}while(i===thLast&&TH.length>1);
    thLast=i;t.textContent='\u00ab'+TH[i]+'\u00bb';
    void t.offsetWidth;t.classList.add('new');
  },620);
}
</script></body></html>
